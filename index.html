<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#09121c"><meta name="description" content="Shadow of the Ember Clan — an original five-region pixel ninja adventure.">
 <title>Shadow of the Ember Clan</title><link rel="stylesheet" href="style.css">
</head>
<body>
 <main>
  <header class="masthead"><a href="#" id="home" aria-label="Pause game or return to title">Ember Clan <span>an isometric adventure</span></a><div class="header-actions"><button id="track-button" title="Music Track Mode (V)">Music: Auto</button><button id="sound-button" title="Toggle music (M)" aria-label="Toggle music">Music on</button><button id="fullscreen-button">Fullscreen</button></div></header>
  <div id="game-shell" class="game-shell">
   <canvas id="game" width="768" height="480" tabindex="0" aria-label="Isometric game. WASD or arrows move. J sword, K shuriken, Space dodge, Shift guard, E interact. Tab opens map, Escape pauses."></canvas>
   <div class="crt" aria-hidden="true"></div>
   <section id="title-screen" class="screen title-screen" aria-label="Main menu">
    <img class="title-art" src="concepts/01-loading-screen.png" alt="Masked ninja with an ember scarf beneath a moonlit citadel">
    <div class="title-shade"></div><div class="title-menu"><p class="menu-subtitle">Five seals. One road to dawn.</p><div class="menu-buttons"><button id="new-game" class="primary">Begin the journey</button><button onclick="location.href='threejs.html'">Play 3D Three.js Mode</button><button id="continue-game" hidden>Continue from shrine</button><button id="show-settings">Settings</button><button id="show-controls">How to play</button><button id="show-credits">Credits</button></div><p class="menu-note">An original pixel adventure · Keyboard / controller / touch</p></div>
    <div id="load-stripes" class="load-stripes" aria-hidden="true"></div>
   </section>
   <section id="cinematic" class="screen cinematic" hidden aria-label="Story scene"><img id="cinematic-art" src="concepts/03-cinematic-intro.png" alt="Ren watches the burning citadel from a temple rooftop"><div class="cinematic-fx" aria-hidden="true"></div><div class="cinematic-caption"><span id="cinematic-chapter">Prologue</span><p id="cinematic-text"></p></div><button id="skip-intro" class="skip">Skip intro ↵</button></section>
   <div id="toast" class="toast" role="status" hidden></div>
   <section id="modal" class="modal-wrap" hidden aria-label="Game menu"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><p id="modal-kicker" class="kicker"></p><h1 id="modal-title"></h1><div id="modal-body"></div><div id="modal-buttons" class="modal-buttons"></div></div></section>
   <div id="touch-controls" class="touch-controls" hidden aria-label="Touch game controls"><div id="touch-stick" class="touch-stick"><i></i><span>Move</span></div><div class="touch-actions"><button data-action="guard">Guard</button><button data-action="throw">Throw</button><button data-action="dodge">Dodge</button><button data-action="attack">Sword</button><button data-action="interact">Use</button><button data-action="pause">Pause</button><button data-action="map">Map</button></div></div>
  </div>
  <footer><p><span class="ember-dot"></span><span id="status">A road through rain, reeds, snow and fire.</span></p><button id="footer-controls">Controls & guide</button><span class="footer-mark">Original pixels · Original score</span></footer>
 </main>
 <script src="core.js"></script><script src="art.js"></script><script src="audio.js"></script><script src="render.js"></script><script src="game.js"></script>
</body>
</html>
