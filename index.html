<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Shadows of the Ember Clan · Three.js 3D Isometric</title>
 <style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0a0e12;color:#e0e0e0;font-family:"Courier New",monospace;display:grid;place-items:center;padding:16px}
  .shell{width:min(1200px,100%)}
  .topbar{display:flex;justify-content:flex-end;align-items:center;padding:0 4px 12px;font-size:12px}
  .topbar a,.topbar button{color:#e0e0e0;background:#1a2028;border:1px solid #58626b;padding:7px 12px;text-decoration:none;cursor:pointer;font:inherit;font-size:11px}
  .topbar button:hover,.topbar a:hover{background:#2d3642;border-color:#88e0a0}
  .frame{width:100%;aspect-ratio:8/5;background:#000;border:3px solid #ffffff;box-shadow:0 18px 60px #000b;display:flex}
  .c64-grid{flex:1;display:grid;grid-template-columns:1fr 264px;grid-template-rows:1fr 142px;background:#000}
  #viewport{position:relative;overflow:hidden;background:#18dc6c;border-right:3px solid #ffffff;border-bottom:3px solid #ffffff}
  .intro-overlay{position:absolute;inset:0;z-index:10;background:#07121c;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:20px;text-align:center}
  .intro-overlay[hidden]{display:none}
  .intro-overlay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.88}
  .intro-shade{position:absolute;inset:0;background:linear-gradient(0deg,#061018f5 10%,#06101866 55%,transparent)}
  .intro-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  #intro-canvas{display:block;width:540px;max-width:94%;height:auto;image-rendering:pixelated;margin-bottom:10px}
  #intro-btn{background:#000000;color:#ffffff;border:3px solid #ffffff;padding:6px 14px;cursor:pointer;display:block}
  #intro-btn:hover{background:#282828;border-color:#e85050}
  #btn-canvas{display:block;width:210px;height:22px;image-rendering:pixelated;pointer-events:none}
  #viewport canvas.webgl{display:block;width:100%;height:100%;image-rendering:pixelated}
  .hud-right{background:#000;border-bottom:3px solid #ffffff;position:relative}
  #side-canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
  .hud-bottom{grid-column:1 / -1;background:#000;position:relative}
  #bottom-canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  #msg-canvas{position:absolute;bottom:8px;left:10px;right:10px;width:calc(100% - 20px);height:30px;image-rendering:pixelated;pointer-events:none;border:2px solid #ffffff;background:#000d}
  #hud-msg{display:none}
  @media(max-width:760px){.c64-grid{grid-template-columns:1fr;grid-template-rows:340px auto auto}.hud-bottom{grid-template-columns:1fr}}
 </style>
</head>
<body>
 <main class="shell">
  <div class="topbar">
   <div style="display:flex;gap:8px">
    <button id="track-btn">Music: Auto (V)</button>
    <button id="mute-btn">Music: On (M)</button>
   </div>
  </div>
  <div class="frame">
   <div class="c64-grid">
   <div id="viewport">
    <div id="intro-overlay" class="intro-overlay">
     <img id="intro-img" src="concepts/01-loading-screen.png" decoding="async" alt="Shadows of the Ember Clan Loading Screen">
     <div class="intro-shade"></div>
     <div class="intro-content">
      <canvas id="intro-canvas" width="270" height="44"></canvas>
      <button id="intro-btn"><canvas id="btn-canvas" width="140" height="15"></canvas></button>
     </div>
    </div>
    <canvas id="msg-canvas" width="320" height="13"></canvas>
    <div id="hud-msg">WASD MOVE . J ATTACK . K STAR . Q WEAPON . SPACE ROLL . E USE</div>
   </div>
   <div class="hud-right">
    <canvas id="side-canvas" width="88" height="156" title="Click HOLDING or press [H] to eat stored apple"></canvas>
   </div>
   <div class="hud-bottom">
    <canvas id="bottom-canvas" width="320" height="46"></canvas>
   </div>
  </div>
 </div>
 </main>
 <script src="core.js"></script>
 <script src="audio.js"></script>
 <script type="module" src="threejs-game.js"></script>
</body>
</html>
